name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  engine:
    name: Python engine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        working-directory: engine
        run: pip install -e ".[dev,image]"
      - name: Tests
        working-directory: engine
        run: pytest -q

  app:
    name: App
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install
        working-directory: app
        run: npm ci
      - name: Type check
        working-directory: app
        run: npx tsc --noEmit
      - name: Tests
        working-directory: app
        run: npm test
      - name: Build
        working-directory: app
        run: npm run build

  parity:
    name: Engine parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install engine
        working-directory: engine
        run: pip install -e ".[dev,image]"
      - name: Install app
        working-directory: app
        run: npm ci
      - name: Python reference
        working-directory: engine
        run: python ../scripts/parity/py_ref.py > /tmp/py.json
      - name: TypeScript reference
        working-directory: app
        run: npx vite-node ../scripts/parity/ts_ref.mjs > /tmp/ts.json
      - name: Compare
        run: python scripts/parity/compare.py /tmp/py.json /tmp/ts.json
