[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aurora-frequency-engine"
version = "0.2.0"
description = "Research-oriented frequency discovery, Chladni pattern and human-response experiment engine"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "scipy>=1.12"]

[project.optional-dependencies]
image = ["pillow>=10"]
ml = ["scikit-learn>=1.4"]
dev = ["pytest>=8.0"]

[project.scripts]
aurora = "aurora.cli:main"

[tool.setuptools.packages.find]
include = ["aurora*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
